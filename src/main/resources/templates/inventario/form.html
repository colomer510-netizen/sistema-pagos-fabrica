<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:640px;">
        <div class="panel-head">Nuevo material</div>
        <div class="panel-body">
            <form th:action="@{/inventario/guardar}" th:object="${material}" method="post">
                <div class="form-grid">
                    <div class="campo">
                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" th:field="*{codigo}" placeholder="MAT-001" required>
                    </div>
                    <div class="campo">
                        <label for="unidad">Unidad de medida</label>
                        <select id="unidad" th:field="*{unidad}">
                            <option value="UN">Unidad</option>
                            <option value="KG">Kilogramo</option>
                            <option value="L">Litro</option>
                            <option value="M">Metro</option>
                            <option value="ROLLO">Rollo</option>
                            <option value="DOCENA">Docena</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Tela de algodón" required>
                    </div>
                    <div class="campo">
                        <label for="stockMinimo">Stock mínimo</label>
                        <input type="number" id="stockMinimo" th:field="*{stockMinimo}" step="0.01" min="0" required>
                    </div>
                    <div class="campo">
                        <label for="stockActual">Stock inicial</label>
                        <input type="number" id="stockActual" th:field="*{stockActual}" step="0.01" min="0" required>
                    </div>
                    <div class="campo">
                        <label for="precioUnitario">Precio unitario (C$)</label>
                        <input type="number" id="precioUnitario" th:field="*{precioUnitario}" step="0.01" min="0" required>
                    </div>
                </div>
                <p style="font-size:12px;color:#718096;margin:0 0 12px;">
                    El sistema alerta en color rojo cuando el stock actual llega al mínimo. Los movimientos
                    de entrada y salida se registran desde la ficha del material.
                </p>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-outline" th:href="@{/inventario}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
