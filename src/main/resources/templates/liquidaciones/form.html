<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:640px;">
        <div class="panel-head">Generar liquidación</div>
        <div class="panel-body">
            <form th:action="@{/liquidaciones/generar}" method="post">
                <div class="form-grid">
                    <div class="campo">
                        <label for="empleadoId">Empleado</label>
                        <select id="empleadoId" name="empleadoId" required>
                            <option value="">-- Seleccionar --</option>
                            <option th:each="e : ${empleados}" th:value="${e.id}"
                                    th:text="${e.codigo} + ' - ' + ${e.nombreCompleto} + (${e.activo} ? '' : ' (inactivo)')"></option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fechaSalida">Fecha de salida</label>
                        <input type="date" id="fechaSalida" name="fechaSalida" required>
                    </div>
                    <div class="campo">
                        <label for="motivo">Motivo de salida</label>
                        <select id="motivo" name="motivo" required>
                            <option value="RENUNCIA">Renuncia</option>
                            <option value="DESPIDO">Despido</option>
                            <option value="JUBILACION">Jubilación</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="otros">Otros montos (C$)</label>
                        <input type="number" id="otros" name="otros" step="0.01" min="0" value="0">
                    </div>
                    <div class="campo" style="grid-column:1 / -1;">
                        <label for="observacion">Observación</label>
                        <textarea id="observacion" name="observacion" rows="2"
                                  placeholder="Notas de la liquidación (opcional)"></textarea>
                    </div>
                </div>
                <p style="font-size:12px;color:#718096;margin:0 0 12px;">
                    La liquidación se calcula automáticamente: vacaciones pendientes (15 días por año trabajado, menos los
                    disfrutados) e indemnización por despido (30 días por año). Al generar la liquidación el empleado
                    pasa a estado inactivo.
                </p>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Generar liquidación</button>
                    <a class="btn btn-outline" th:href="@{/liquidaciones}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
