<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:520px;">
        <div class="panel-head">
            <span>Cambiar contraseña</span>
        </div>
        <div class="panel-body">
            <div class="alerta alerta-info">
                Debes cambiar tu contraseña para continuar. Usa al menos 8 caracteres.
            </div>
            <form th:action="@{/cambiar-password}" method="post">
                <div class="campo">
                    <label for="passwordActual">Contraseña actual</label>
                    <input type="password" id="passwordActual" name="passwordActual" required autofocus>
                </div>
                <div class="campo">
                    <label for="passwordNueva">Nueva contraseña</label>
                    <input type="password" id="passwordNueva" name="passwordNueva" minlength="8" required>
                </div>
                <div class="campo">
                    <label for="confirmacion">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmacion" name="confirmacion" minlength="8" required>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Guardar contraseña</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
