<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:640px;">
        <div class="panel-head">Registrar asistencia</div>
        <div class="panel-body">
            <form th:action="@{/asistencia/registrar}" method="post">
                <div class="form-grid">
                    <div class="campo">
                        <label for="empleadoId">Empleado</label>
                        <select id="empleadoId" name="empleadoId" required>
                            <option value="" th:text="'Seleccionar...'">Seleccionar</option>
                            <option th:each="e : ${empleados}" th:value="${e.id}"
                                    th:text="${e.codigo} + ' - ' + ${e.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" th:value="${hoy}" required>
                    </div>
                    <div class="campo">
                        <label for="horasTrabajadas">Horas trabajadas</label>
                        <input type="number" id="horasTrabajadas" name="horasTrabajadas" min="0" max="24" value="8" required>
                    </div>
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado">
                            <option th:each="s : ${estados}" th:value="${s}" th:text="${s}">P</option>
                        </select>
                    </div>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Registrar</button>
                    <a class="btn btn-outline" th:href="@{/asistencia}">Cancelar</a>
                </div>
            </form>
            <p style="font-size:12px;color:#718096;margin-top:14px;">
                Estados: P = Presente, E = Enfermedad, V = Vacaciones, F = Falta.
            </p>
        </div>
    </div>
</div>
</body>
</html>
