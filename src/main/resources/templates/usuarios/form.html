<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:600px;">
        <div class="panel-head" th:text="${modo == 'nuevo'} ? 'Nuevo usuario' : 'Editar usuario'">
            Formulario
        </div>
        <div class="panel-body">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="campo">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" th:field="*{username}" required>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" th:field="*{nombre}" required>
                    </div>
                    <div class="campo">
                        <label for="rol">Rol</label>
                        <select id="rol" th:field="*{rol}">
                            <option value="ADMIN">ADMIN (Administrador)</option>
                            <option value="LECTOR">LECTOR (Solo lectura)</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password"
                               th:required="${modo == 'nuevo'}">
                        <span class="error" style="font-size:12px;color:#718096;"
                              th:text="${modo == 'editar'} ? '(Dejar vacío para conservar la contraseña actual)' : ''">
                        </span>
                    </div>
                </div>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-outline" th:href="@{/usuarios}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
