<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: html}">
<body>
<div th:fragment="contenido">
    <div class="panel" style="max-width:640px;">
        <div class="panel-head">Nuevo presupuesto</div>
        <div class="panel-body">
            <form th:action="@{/presupuestos/guardar}" th:object="${presupuesto}" method="post">
                <div class="form-grid">
                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" th:field="*{categoria}" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="INSUMOS">Insumos y materiales</option>
                            <option value="SERVICIOS">Servicios</option>
                            <option value="ALQUILER">Alquiler</option>
                            <option value="IMPUESTOS">Impuestos</option>
                            <option value="TRANSPORTE">Transporte</option>
                            <option value="SALARIOS">Salarios</option>
                            <option value="OTROS EGRESOS">Otros egresos</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="periodo">Periodo</label>
                        <input type="month" id="periodo" th:field="*{periodo}" required>
                    </div>
                    <div class="campo">
                        <label for="monto">Monto presupuestado (C$)</label>
                        <input type="number" id="monto" th:field="*{monto}" step="0.01" min="0.01" required>
                    </div>
                </div>
                <p style="font-size:12px;color:#718096;margin:0 0 12px;">
                    El presupuesto se compara automáticamente con los egresos de la misma categoría en el periodo,
                    tomados de la caja.
                </p>
                <div class="form-acciones">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a class="btn btn-outline" th:href="@{/presupuestos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
